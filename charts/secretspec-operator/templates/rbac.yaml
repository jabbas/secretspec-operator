{{/* SPDX-License-Identifier: Apache-2.0 */}}
{{- /*
RBAC of design §9. Nothing beyond these rules may be granted.
- watchNamespaces empty: ClusterRole + ClusterRoleBinding (all namespaces).
- watchNamespaces listed: a Role + RoleBinding in each listed namespace and
  no cluster-scoped RBAC at all.
- Leases: a Role + RoleBinding in the release namespace (leader election).
*/}}
{{- define "secretspec-operator.rules" -}}
- apiGroups: ["secretspec.jabbas.eu"]
  resources: ["secretspecs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["secretspec.jabbas.eu"]
  resources: ["secretspecs/status"]
  verbs: ["get", "patch", "update"]
- apiGroups: ["secretspec.jabbas.eu"]
  resources: ["secretspecs/finalizers"]
  verbs: ["update"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "patch", "update"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "patch"]
{{- end }}
{{- define "secretspec-operator.subjects" -}}
- kind: ServiceAccount
  name: {{ include "secretspec-operator.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- $fullname := include "secretspec-operator.fullname" . }}
{{- if empty .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "secretspec-operator.labels" . | nindent 4 }}
rules:
  {{- include "secretspec-operator.rules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "secretspec-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}
subjects:
  {{- include "secretspec-operator.subjects" . | nindent 2 }}
{{- else }}
{{- range $namespace := .Values.watchNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace }}
  labels:
    {{- include "secretspec-operator.labels" $ | nindent 4 }}
rules:
  {{- include "secretspec-operator.rules" $ | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}
  namespace: {{ $namespace }}
  labels:
    {{- include "secretspec-operator.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}
subjects:
  {{- include "secretspec-operator.subjects" $ | nindent 2 }}
{{- end }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretspec-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ include "secretspec-operator.fullname" . | quote }}]
    verbs: ["get", "update"]
  # `create` cannot be limited by resourceNames (the name is not known to
  # authorization before the object exists).
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretspec-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election
subjects:
  {{- include "secretspec-operator.subjects" . | nindent 2 }}
{{- end }}
