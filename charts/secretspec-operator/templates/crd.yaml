{{- /*
The CRD is rendered as a template (not from crds/) so that `helm upgrade`
updates it. The source is generated by `cargo xtask crdgen`; only labels and
the resource-policy annotation are added, the spec is passed through as is.
*/}}
{{- if .Values.crds.install }}
{{- $path := "files/crd/secretspecs.secretspec.jabbas.eu.yaml" }}
{{- $crd := .Files.Get $path | fromYaml }}
{{- if or (not $crd) (hasKey $crd "Error") (ne (get $crd "kind") "CustomResourceDefinition") }}
{{- fail (printf "cannot load the CRD from %s" $path) }}
{{- end }}
{{- $meta := $crd.metadata }}
{{- $labels := include "secretspec-operator.labels" . | fromYaml }}
{{- $_ := set $meta "labels" (merge ($meta.labels | default dict) $labels) }}
{{- if .Values.crds.keep }}
{{- $_ := set $meta "annotations" (merge ($meta.annotations | default dict) (dict "helm.sh/resource-policy" "keep")) }}
{{- end }}
---
{{ toYaml $crd }}
{{- end }}
