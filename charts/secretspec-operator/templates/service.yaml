{{- if .Values.metrics.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secretspec-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secretspec-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "secretspec-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      protocol: TCP
{{- end }}
