[workspace]
resolver = "3"
members = ["crates/secretspec-api", "crates/secretspec-core", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jabbas/secretspec-operator"
# Floor imposed by kube 4.x; rust-toolchain.toml tracks current stable.
rust-version = "1.89"

[workspace.dependencies]
kube = { version = "4.2", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_34", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the archived serde_yaml.
serde_norway = "0.9"
sha2 = "0.11"
hex = "0.4"
thiserror = "2"
zeroize = "1"
tokio = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
