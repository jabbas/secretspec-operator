[workspace]
resolver = "3"
members = ["crates/secretspec-api", "crates/secretspec-core", "crates/secretspec-operator", "xtask"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jabbas/secretspec-operator"
# Floor imposed by kube 4.x; rust-toolchain.toml pins an exact stable release.
rust-version = "1.89"

[workspace.dependencies]
kube = { version = "4.2", default-features = false, features = ["derive"] }
k8s-openapi = { version = "0.28", default-features = false, features = ["v1_34", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Maintained fork of the archived serde_yaml.
serde_norway = "0.9"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
thiserror = "2"
zeroize = "1"
tokio = "1"
data-encoding = "2"
# rand_core 0.6 is the version stable `ssh-key` 0.6.x uses; generators take
# its `CryptoRngCore`. `OsRng` (feature `getrandom`) seeds the production RNG.
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
prometheus-client = "0.25"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "ansi", "json", "env-filter"] }

[profile.dev]
debug = "line-tables-only"   # backtraces keep file:line, much smaller artifacts

[profile.dev.package."*"]
debug = 0                    # no debuginfo for dependencies

[profile.test]
debug = "line-tables-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
