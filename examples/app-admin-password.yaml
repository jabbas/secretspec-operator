# SPDX-License-Identifier: Apache-2.0
#
# Admin password for an application that stores it on first start.
#
# Use this when the application copies the credential into its own database
# (for example an initial admin account): the Secret must outlive the
# SecretSpec, otherwise deleting and re-creating the SecretSpec would generate
# a password the application no longer accepts. `deletionPolicy: Retain`
# leaves the Secret in place when the SecretSpec is deleted.
#
# Apply with: kubectl apply -n <namespace> -f app-admin-password.yaml
# The Secret `app-admin` gets the keys `username` and `password`.
apiVersion: secretspec.jabbas.eu/v1alpha1
kind: SecretSpec
metadata:
  name: app-admin
spec:
  deletionPolicy: Retain
  data:
    username: admin
  fields:
    # 32 random alphanumeric characters (the default).
    - name: password
