# SPDX-License-Identifier: Apache-2.0
#
# Database master password accepted by Amazon RDS.
#
# Use this when the password is passed to a managed database that restricts
# the characters of master passwords (RDS rejects `/`, `@`, `"` and space) and
# requires a mix of character classes. `charset: ascii` draws from letters,
# digits and punctuation; `exclude` removes the forbidden characters; `require`
# guarantees at least one lower-case letter, upper-case letter, digit and
# symbol.
#
# The database keeps the password, so the Secret is retained when the
# SecretSpec is deleted.
#
# Apply with: kubectl apply -n <namespace> -f rds-compatible-password.yaml
apiVersion: secretspec.jabbas.eu/v1alpha1
kind: SecretSpec
metadata:
  name: rds-master
spec:
  deletionPolicy: Retain
  data:
    username: dbadmin
  fields:
    - name: password
      length: 32
      charset: ascii
      exclude: '/@" '
      require:
        lower: 1
        upper: 1
        digits: 1
        symbols: 1
