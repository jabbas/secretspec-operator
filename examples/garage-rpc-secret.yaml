#
# Garage cluster RPC secret plus an S3-style key pair.
#
# Use this when deploying the Garage object store: every node of a cluster
# must share the same `rpc_secret` (32 random bytes, hex encoded), and
# applications need an access key id (`GK` followed by 24 hex characters) and
# a secret access key. All three live in one Secret, so they are created
# together and never drift apart.
#
# Pass `rpc-secret` to Garage as GARAGE_RPC_SECRET (or mount it and point
# `rpc_secret_file` at it), and register the key pair with `garage key import`.
#
# Apply with: kubectl apply -n <namespace> -f garage-rpc-secret.yaml
apiVersion: secretspec.jabbas.eu/v1alpha1
kind: SecretSpec
metadata:
  name: garage
spec:
  deletionPolicy: Retain
  fields:
    - name: rpc-secret
      bytes: 32
      encoding: hex
    - name: access-key-id
      prefix: GK
      length: 24
      charset: hex
    - name: secret-access-key
      bytes: 32
      encoding: hex
