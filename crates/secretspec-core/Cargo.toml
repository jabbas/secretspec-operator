[package]
name = "secretspec-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
secretspec-api = { path = "../secretspec-api" }
bcrypt = "0.19"
data-encoding.workspace = true
hex.workspace = true
hmac.workspace = true
# The timestamp type inside k8s-openapi's `Time`; keep the same 0.2 line so
# both resolve to one copy.
jiff = { version = "0.2.38", default-features = false, features = ["alloc"] }
k8s-openapi.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Stable 0.6 series (rand_core 0.6); the 0.7 line is release-candidate only.
ssh-key = { version = "0.6.7", default-features = false, features = ["crypto", "std"] }
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde_norway.workspace = true
