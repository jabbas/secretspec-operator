[package]
name = "secretspec-operator"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
secretspec-api = { path = "../secretspec-api" }
secretspec-core = { path = "../secretspec-core" }
# The timestamp type inside k8s-openapi's `Time`; same 0.2 line as secretspec-core.
jiff = { version = "0.2.38", default-features = false, features = ["alloc"] }
k8s-openapi.workspace = true
# `ring` is the single rustls crypto provider used across the workspace.
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
