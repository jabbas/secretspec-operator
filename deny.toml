[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    # RSA timing side channel in private-key *operations* (Marvin Attack), no
    # patched release. The operator only generates RSA keys (via `ssh-key`) and
    # never performs private-key operations (no signing or decryption).
    { id = "RUSTSEC-2023-0071", reason = "the operator only generates RSA keys and never performs private-key operations" },
    # Timing variability in `crypto-bigint` operations meant to be constant-time
    # (subtraction, zero counting, division, Montgomery multiplication). No
    # fixed 0.5.x exists; the fix is in crypto-bigint >= 0.7.6. We have 0.5.5,
    # pulled in by ssh-key 0.6 -> elliptic-curve 0.13 -> p256/p384/p521, which
    # the operator uses only to GENERATE SSH ECDSA key pairs (ed25519, the
    # default, RSA and bcrypt do not use it). Exposed: the subtraction-based
    # `ct_lt` range check and the byte conversions on the freshly sampled secret
    # scalar during key generation. The operator never signs, derives or
    # decrypts. Exploiting it needs a co-resident microarchitectural timing
    # observer during generation. Revisit when a stable ssh-key 0.7 ships.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 (no fixed 0.5.x) only in SSH ECDSA key generation via ssh-key 0.6; the operator never signs, derives or decrypts; needs a co-resident timing observer; revisit with ssh-key 0.7" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Root certificates via kube-client rustls (webpki-root-certs: Mozilla root-certificate data).
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
