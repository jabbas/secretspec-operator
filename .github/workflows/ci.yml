# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cargo caches (rust-cache, via setup-rust-toolchain) are restored everywhere
# but saved only on main (`cache-save-if`), so pull requests never fill the
# repository's cache quota. Saving on main keeps the caches that pull requests
# and later main runs restore.
jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace

  # RSA key generation is too slow for debug builds; run every ignored core
  # test (RSA 4096 generator, RSA planner fixtures) in release mode.
  test-slow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p secretspec-core --release -- --ignored

  crdgen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask crdgen --check

  # The third-party licence bundle that build/Containerfile copies to
  # /licenses/ must be generatable (every crate has, or has a fallback for,
  # a licence text).
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask licenses

  # Lints the Helm chart and checks its rendered objects (RBAC, image
  # reference, security context, env, probes, CRD) for several value sets.
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - run: cargo xtask chart-test

  # Tests the scripts of the release workflow: the index update of its
  # `helm-index` job (.github/scripts/helm-index.sh) and the CI gate of its
  # `verify` job (.github/scripts/ci-status.sh), its release mode
  # (release-mode.sh) and the chart comparison of the promote mode
  # (chart-compare.sh). Hermetic: no network, a local git remote and a fake
  # `gh`. Also checks the job graph of release.yml statically
  # (release-graph-check.sh): a job after a mode-dependent job needs an
  # explicit `if:`.
  release-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      # yq is pinned (checksum verified); jq and python3 are the runner
      # image's (the tests only read JSON with jq and serve a local file).
      - run: bash .github/scripts/install-yq.sh
      - run: bash .github/scripts/helm-index-test.sh
      - run: bash .github/scripts/ci-status-test.sh
      - run: bash .github/scripts/release-mode-test.sh
      - run: bash .github/scripts/chart-compare-test.sh
      - run: bash .github/scripts/registry-lookup-test.sh
      - run: bash .github/scripts/release-graph-check-test.sh
      - run: bash .github/scripts/release-graph-check.sh

  # release.yml downloads syft, grype and crane against SHA-256 values pinned
  # in .github/scripts/install-release-tools.sh, but it runs only on tags. This
  # job runs that same script (the one place for those pins, `all` = every tool
  # in it) on every pull request, so a version bump without its checksum
  # (which Renovate cannot compute) fails here, with the `::error::` that names
  # the variable, and not at the next release candidate. yq is covered by the
  # `release-scripts` job (install-yq.sh). Nothing downloaded is run beyond
  # `--version`.
  release-pins:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned release tools
        run: bash .github/scripts/install-release-tools.sh all
      - name: Run the downloaded tools (--version only)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        run: |
          syft --version
          grype --version
          crane version

  # Applies the generated CRD to a real API server and checks the fixtures
  # against its validation (CEL, schema, defaulting). Node images are those
  # published with the pinned kind release (`version:` of kind-action), by
  # digest. Renovate moves the kind release and the node images together
  # (renovate.json); a new Kubernetes minor is added to the matrices by hand.
  server-validation:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubernetes: "1.37"
            node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    name: server-validation (Kubernetes ${{ matrix.kubernetes }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: secretspec-api-${{ matrix.kubernetes }}
          node_image: ${{ matrix.node_image }}
          wait: 120s
      - name: Export kubeconfig
        env:
          CLUSTER: secretspec-api-${{ matrix.kubernetes }}
        run: kind get kubeconfig --name "$CLUSTER" > "$RUNNER_TEMP/kubeconfig"
      - name: Server-side validation
        env:
          SECRETSPEC_TEST_KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: cargo test -p secretspec-api --test server_validation -- --ignored --test-threads=1

  # Runs the operator in-process against a real API server, as a
  # ServiceAccount with exactly the operator's RBAC (impersonated). Same kind
  # release and node images as server-validation.
  operator-integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubernetes: "1.37"
            node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    name: operator-integration (Kubernetes ${{ matrix.kubernetes }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: secretspec-operator-${{ matrix.kubernetes }}
          node_image: ${{ matrix.node_image }}
          wait: 120s
      - name: Export kubeconfig
        env:
          CLUSTER: secretspec-operator-${{ matrix.kubernetes }}
        run: kind get kubeconfig --name "$CLUSTER" > "$RUNNER_TEMP/kubeconfig"
      - name: Operator integration tests
        env:
          SECRETSPEC_TEST_KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: cargo test -p secretspec-operator --test integration -- --ignored --test-threads=1

  # Installs the Helm chart from the working tree with the image built from
  # build/Containerfile (static musl binary, loaded into kind) and runs the
  # end-to-end tests: examples, upgrade/restart, uninstall, namespace mode,
  # log redaction. Same kind release and node images as server-validation.
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - kubernetes: "1.34"
            node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          - kubernetes: "1.37"
            node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    name: e2e (Kubernetes ${{ matrix.kubernetes }})
    timeout-minutes: 45
    env:
      SECRETSPEC_E2E_IMAGE: localhost/secretspec-operator:e2e
      CLUSTER: secretspec-e2e-${{ matrix.kubernetes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          target: x86_64-unknown-linux-musl
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      # Same toolchain as docs/development.md ("Building the image").
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-zigbuild@0.24.0,cargo-auditable@0.7.7
      - name: Install zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --require-hashes -r .github/requirements/ziglang.txt
          echo "$RUNNER_TEMP/zig-venv/bin" >> "$GITHUB_PATH"
      - name: Build the static binary
        # The zig linker prints a deprecation warning that cargo's build.warnings=deny
        # (set by setup-rust-toolchain) turns into an error; code warnings stay denied by the clippy job.
        env:
          CARGO_BUILD_WARNINGS: warn
        run: cargo xtask dist --target x86_64-unknown-linux-musl --release
      # build/Containerfile copies the bundle to /licenses/.
      - name: Collect the licence texts
        run: cargo xtask licenses
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit v0.35.0, pinned by index digest.
          driver-opts: image=moby/buildkit@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - name: Build the image
        run: |
          docker buildx build --load --platform linux/amd64 \
            --build-arg VERSION=0.0.0-e2e --build-arg REVISION="$GITHUB_SHA" \
            -f build/Containerfile -t "$SECRETSPEC_E2E_IMAGE" .
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.33.0
          cluster_name: ${{ env.CLUSTER }}
          node_image: ${{ matrix.node_image }}
          wait: 120s
      - name: Load the image into kind
        run: kind load docker-image "$SECRETSPEC_E2E_IMAGE" --name "$CLUSTER"
      - name: Export kubeconfig
        run: kind get kubeconfig --name "$CLUSTER" > "$RUNNER_TEMP/kubeconfig"
      - name: End-to-end tests
        env:
          SECRETSPEC_E2E_KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: cargo test -p secretspec-operator --test e2e -- --ignored --test-threads=1
      # Diagnostics for a failed run. No Secret is read: only pods, operator
      # logs (which never contain values), SecretSpecs and events.
      - name: Dump diagnostics
        if: failure()
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
        run: |
          kubectl get pods --all-namespaces -o wide || true
          kubectl --namespace secretspec-system describe pods || true
          kubectl --namespace secretspec-system logs --selector app.kubernetes.io/name=secretspec-operator --all-containers --tail=500 --prefix || true
          kubectl --namespace secretspec-system logs --selector app.kubernetes.io/name=secretspec-operator --all-containers --previous --tail=200 --prefix || true
          kubectl get secretspecs --all-namespaces -o wide || true
          kubectl get events --all-namespaces --sort-by=.lastTimestamp || true

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit
