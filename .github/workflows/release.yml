# SPDX-License-Identifier: Apache-2.0
#
# Signed release workflow. Runs only for tags `X.Y.Z` and `X.Y.Z-rc.N`
# (plain semver, no `v` prefix; the legacy `v0.1.0*` tags predate this).
#
#   verify -> build -> image -> smoke -> chart -> release
#
# Procedure and verification: docs/development.md ("Releasing") and
# docs/security.md ("Release signing and SBOM"). Signatures are keyless
# (GitHub OIDC); the certificate identity is this file at the tag:
#   https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/<tag>
# so renaming this file changes the identity users verify against.
name: Release

on:
  push:
    tags:
      # Glob patterns, not regular expressions. Both are re-validated with a
      # regular expression in the `verify` job.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

# Nothing is granted by default; every job lists what it needs. Write scopes
# are on the jobs that push, and `id-token: write` only on the jobs that sign.
permissions: {}

# One run per tag. Never cancel a release half-way: a cancelled run leaves a
# pushed but unsigned image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash -eo pipefail

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/jabbas/secretspec-operator
  CHART_REPO: oci://ghcr.io/jabbas/charts
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
  # Pinned tools downloaded as release binaries. Each is verified against the
  # SHA-256 of the linux_amd64 archive (taken from the upstream
  # `*_checksums.txt` of that release). Bump version and checksum together.
  COSIGN_VERSION: v2.6.5
  SYFT_VERSION: 1.55.0
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  GRYPE_VERSION: 0.121.0
  GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519

jobs:
  # Validates the tag against the workspace version and runs the full gate.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be checked against main
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - name: Check the tag against the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::tag '$TAG' is neither X.Y.Z nor X.Y.Z-rc.N"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          version="$TAG" # the tag is the version
          prerelease=false
          if [[ -n "${BASH_REMATCH[2]}" ]]; then
            prerelease=true
          fi

          workspace="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "secretspec-operator") | .version')"
          chart_version="$(yq '.version' charts/secretspec-operator/Chart.yaml)"
          chart_app_version="$(yq '.appVersion' charts/secretspec-operator/Chart.yaml)"
          echo "tag=$TAG version=$version base=$base workspace=$workspace chart=$chart_version appVersion=$chart_app_version"

          # Final tag: equals the workspace version. rc tag: its base does.
          if [[ "$base" != "$workspace" ]]; then
            echo "::error::tag '$TAG' (version $base) does not match the workspace version $workspace"
            exit 1
          fi
          # The committed chart is never edited for an rc; it must carry the
          # workspace version, and the rc version is applied at `helm package`.
          if [[ "$chart_version" != "$workspace" || "$chart_app_version" != "$workspace" ]]; then
            echo "::error::Chart.yaml version/appVersion ($chart_version/$chart_app_version) must equal the workspace version $workspace"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main; releases are tagged on main"
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      # The full CI gate (.github/workflows/ci.yml), minus the kind-based
      # suites that the PR and main runs already passed.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # RSA key generation is too slow for debug builds.
      - run: cargo test -p secretspec-core --release -- --ignored
      - run: cargo xtask crdgen --check
      - run: cargo xtask chart-test
      - run: cargo deny check
      - run: cargo audit

  # Static musl binaries for both architectures, built once and shared with
  # the image job as an artifact.
  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false # nothing restored may end up in a signed artifact
      - name: Add the musl targets
        run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      # Same toolchain as docs/development.md ("Building the image").
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # cargo-auditable embeds the dependency list in the binary, so the
          # SBOM and the vulnerability scan see the crates, not only the
          # distroless packages.
          tool: cargo-zigbuild@0.23.4,cargo-auditable@0.7.7
      - name: Install zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --require-hashes -r .github/requirements/ziglang.txt
          echo "$RUNNER_TEMP/zig-venv/bin" >> "$GITHUB_PATH"
      - name: Build amd64
        # The zig linker prints a deprecation warning that cargo's build.warnings=deny
        # (set by setup-rust-toolchain) turns into an error; code warnings stay denied by CI clippy.
        env:
          CARGO_BUILD_WARNINGS: warn
        run: cargo xtask dist --target x86_64-unknown-linux-musl --release
      - name: Build arm64
        # The zig linker prints a deprecation warning that cargo's build.warnings=deny
        # (set by setup-rust-toolchain) turns into an error; code warnings stay denied by CI clippy.
        env:
          CARGO_BUILD_WARNINGS: warn
        run: cargo xtask dist --target aarch64-unknown-linux-musl --release
      - name: Check the binaries
        run: |
          # Static musl ELF per architecture (`file` prints "statically linked"
          # or "static-pie linked").
          file target/dist/amd64/secretspec-operator target/dist/arm64/secretspec-operator
          file target/dist/amd64/secretspec-operator | grep -q 'x86-64'
          file target/dist/arm64/secretspec-operator | grep -q 'aarch64'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: target/dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Multi-arch image: push by digest, scan, SBOM, sign, attest, then tag and
  # verify. The tag is set last and only if it is free or already points at the
  # same digest, so no re-run can move it: a re-run that finds the tag resumes
  # with the digest it points to instead of building a new image.
  image:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image and its signatures
      id-token: write # keyless signing
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      digest_amd64: ${{ steps.platforms.outputs.amd64 }}
      digest_arm64: ${{ steps.platforms.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: target/dist
      - name: Restore the executable bit
        # Artifacts do not keep file modes; COPY in the Containerfile would
        # otherwise produce a non-executable ENTRYPOINT.
        run: |
          chmod 0755 target/dist/amd64/secretspec-operator target/dist/arm64/secretspec-operator
          ls -l target/dist/amd64 target/dist/arm64
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install syft and grype
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin"
          for tool in syft grype; do
            case "$tool" in
              syft)  version="$SYFT_VERSION";  sha="$SYFT_SHA256";  project=anchore/syft ;;
              grype) version="$GRYPE_VERSION"; sha="$GRYPE_SHA256"; project=anchore/grype ;;
            esac
            archive="${tool}_${version}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
              "https://github.com/$project/releases/download/v${version}/${archive}"
            echo "$sha  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tools/bin" "$tool"
          done
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # BuildKit v0.34.1, pinned by index digest.
          driver-opts: image=moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Resume: when the tag already exists (an earlier attempt got as far as
      # tagging), its digest is used and nothing is rebuilt. The build is not
      # reproducible, so a rebuild would produce a different digest.
      - name: Look for an already published tag
        id: existing
        run: |
          source .github/scripts/registry-lookup.sh
          # Lenient: a wrong "absent" here only costs a pointless build, the
          # tag step below re-checks strictly before it writes anything.
          digest="$(tag_digest "$IMAGE:$TAG" lenient)"
          if [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "::notice::$IMAGE:$TAG already exists ($digest); resuming with it, nothing is rebuilt"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Pushed by digest, without any tag: the tag is set only after the image
      # has been scanned, signed and attested (see "Tag the image").
      - name: Build and push the multi-arch image (by digest)
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Containerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            REVISION=${{ github.sha }}
          # Keep the index plain (two platform manifests). Signing and the
          # SBOM attestation are done below with cosign.
          provenance: false
          sbom: false
      - name: Select the index digest
        id: index
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Resolve the per-platform digests
        id: platforms
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > index.json
          jq . index.json
          test "$(jq '.manifests | length' index.json)" = 2
          for arch in amd64 arm64; do
            digest="$(jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' index.json)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
      # Vulnerability scan of the pushed digests. Fails on a fixable
      # high/critical finding, before anything is signed.
      - name: Scan the image
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          grype "registry:$IMAGE@$DIGEST_AMD64" --fail-on high --only-fixed
          grype "registry:$IMAGE@$DIGEST_ARM64" --fail-on high --only-fixed
      - name: Generate the SBOMs (SPDX JSON, one per architecture)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          mkdir sbom
          syft "registry:$IMAGE@$DIGEST_AMD64" -o "spdx-json=sbom/secretspec-operator-${TAG}-linux-amd64.spdx.json"
          syft "registry:$IMAGE@$DIGEST_ARM64" -o "spdx-json=sbom/secretspec-operator-${TAG}-linux-arm64.spdx.json"
          ls -l sbom
          # The binary is built with cargo-auditable: each SBOM must list the
          # Rust crates (pkg:cargo/...) next to the distroless packages. A
          # build that lost the embedded data would otherwise go unnoticed.
          for sbom in sbom/*.spdx.json; do
            crates="$(jq '[.packages[] | select(any(.externalRefs[]?; (.referenceLocator // "") | startswith("pkg:cargo/")))] | length' "$sbom")"
            echo "$sbom: $crates Rust crates"
            test "$crates" -ge 100
          done
      # Signatures: the index (what a tag resolves to, and what `cosign verify
      # <image>:<tag>` checks) and each platform manifest. The SBOM
      # attestation goes on the platform manifests, because an SBOM describes
      # one platform's contents.
      - name: Sign the image
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign sign --yes \
            "$IMAGE@$INDEX_DIGEST" "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
      - name: Attest the SBOMs
        env:
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "sbom/secretspec-operator-${TAG}-linux-amd64.spdx.json" "$IMAGE@$DIGEST_AMD64"
          cosign attest --yes --type spdxjson \
            --predicate "sbom/secretspec-operator-${TAG}-linux-arm64.spdx.json" "$IMAGE@$DIGEST_ARM64"
      # The only step that creates the tag. It refuses to touch a tag that
      # points anywhere else.
      - name: Tag the image
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          source .github/scripts/registry-lookup.sh
          # Strict: the repository exists by now (the image was pushed by
          # digest), so a missing tag is answered "manifest unknown". Any
          # other answer, in particular an access error, stops the job
          # instead of risking an overwrite.
          current="$(tag_digest "$IMAGE:$TAG" strict)"
          if [[ -z "$current" ]]; then
            docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$INDEX_DIGEST"
            current="$(tag_digest "$IMAGE:$TAG" strict)"
          fi
          if [[ "$current" != "$INDEX_DIGEST" ]]; then
            echo "::error::$IMAGE:$TAG points to '$current', not to $INDEX_DIGEST; a pushed tag is never moved. Cut the next release candidate."
            exit 1
          fi
      # The commands documented in docs/installation.md and docs/security.md.
      - name: Verify what was published
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${TAG}"

          # By tag, as a user does; it must resolve to the digest we signed.
          cosign verify "$IMAGE:$TAG" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > verify.json
          jq -e --arg d "$INDEX_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' verify.json

          for digest in "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            cosign verify "$IMAGE@$digest" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > /dev/null
            cosign verify-attestation "$IMAGE@$digest" --type spdxjson \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > attestation.json
            # The signed statement carries the SPDX document as its predicate.
            jq -e -s 'length > 0 and all(.[]; (.payload | @base64d | fromjson | .predicateType == "https://spdx.dev/Document"))' attestation.json
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Runs the pushed image on both architectures (arm64 under QEMU).
  smoke:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    name: smoke (${{ matrix.platform }})
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run the image
        env:
          PLATFORM: ${{ matrix.platform }}
          INDEX_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker run --rm --platform "$PLATFORM" --read-only --user 65532:65532 \
            "$IMAGE@$INDEX_DIGEST" --help

  chart:
    needs: [verify, image, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the chart and its signature
      id-token: write # keyless signing
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # cosign reads the Docker credentials; helm keeps its own.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to the chart registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
      # Resume: a chart version that is already published is never packaged
      # or pushed again (the package is not byte-reproducible, so a second
      # push would put a different digest under the same version). The
      # published package is pulled instead and carried through the same
      # checks, signing and verification.
      - name: Look for an already published chart
        id: existing
        run: |
          source .github/scripts/registry-lookup.sh
          mkdir existing
          chart_resolve "$CHART_REPO/secretspec-operator" "$VERSION" existing pull.log
          echo "chart lookup: $CHART_STATE"
          if [[ "$CHART_STATE" == found ]]; then
            cat pull.log
            digest="$(awk '/^Digest:/ {print $2}' pull.log)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "::notice::chart $VERSION already exists ($digest); resuming with it, nothing is pushed"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            # helm's stderr only (no credentials, no secret data): shows how
            # the registry really answered for a package that is not there.
            echo "--- pull.log ---"
            cat pull.log
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # The committed Chart.yaml keeps the workspace version; the release
      # version (which may be an rc) is applied here only.
      - name: Package the chart
        env:
          PUBLISHED: ${{ steps.existing.outputs.published }}
        run: |
          mkdir chart
          if [[ "$PUBLISHED" == "true" ]]; then
            cp "existing/secretspec-operator-${VERSION}.tgz" chart/
          else
            helm package charts/secretspec-operator \
              --version "$VERSION" --app-version "$VERSION" --destination chart
          fi
          ls -l chart
      - name: Check the packaged chart
        run: |
          package="chart/secretspec-operator-${VERSION}.tgz"
          test "$(helm show chart "$package" | yq '.version')" = "$VERSION"
          test "$(helm show chart "$package" | yq '.appVersion')" = "$VERSION"
          # The default image must be exactly the image pushed for this tag
          # (the tag, the chart version and the appVersion are identical).
          images="$(helm template secretspec-operator "$package" \
            | yq 'select(.kind == "Deployment") | .spec.template.spec.containers[].image')"
          echo "rendered image(s): $images"
          test "$images" = "$IMAGE:$TAG"
      - name: Push the chart
        id: push
        if: steps.existing.outputs.published != 'true'
        run: |
          source .github/scripts/registry-lookup.sh
          # `helm push` overwrites an existing version, so look once more,
          # right before writing. The result of the first lookup may have been
          # a misread access error.
          mkdir recheck
          chart_resolve "$CHART_REPO/secretspec-operator" "$VERSION" recheck recheck.log
          echo "chart recheck: $CHART_STATE"
          if [[ "$CHART_STATE" == found ]]; then
            echo "::error::chart $VERSION exists in the registry; not pushing over it. Re-run the failed jobs to resume with it."
            exit 1
          fi
          echo "--- recheck.log ---"
          cat recheck.log
          helm push "chart/secretspec-operator-${VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/ {print $2}' push.log)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Select the chart digest
        id: chart_digest
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the chart
        env:
          CHART_DIGEST: ${{ steps.chart_digest.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO#oci://}/secretspec-operator@$CHART_DIGEST"
      - name: Verify the chart
        env:
          CHART_DIGEST: ${{ steps.chart_digest.outputs.digest }}
        run: |
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${TAG}"
          cosign verify "${CHART_REPO#oci://}/secretspec-operator:${VERSION}" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > verify.json
          jq -e --arg d "$CHART_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' verify.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: chart
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: [verify, image, smoke, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Create the release
        run: |
          ls -l assets
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/SHA256SUMS
          cat assets/SHA256SUMS

          cat > notes.md <<EOF
          Image: \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)
          Chart: \`oci://ghcr.io/jabbas/charts/secretspec-operator\` version \`$VERSION\`

          The image and the chart are signed with cosign (keyless, GitHub OIDC); the
          SPDX SBOMs are signed attestations on the per-platform images and are
          attached here as plain files. How to verify: [docs/security.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/security.md#release-signing-and-sbom).

          ---

          EOF

          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
                --notes-file notes.md --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            # A release candidate: the notes cover the changes since the
            # previous tag, whatever it is (GitHub's default).
            args+=(--prerelease)
          else
            # A final release: the notes cover everything since the previous
            # FINAL tag, so the release candidates in between are included.
            # The first final release has no start tag: the notes then cover
            # the whole history. A failed tag lookup is NOT that case: it
            # fails the job (the exit status of gh is kept apart from the
            # filter's, where only "no match" is tolerated).
            if ! all_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name')"; then
              echo "::error::could not list the repository tags; refusing to publish notes without a start tag"
              exit 1
            fi
            # Final tags are X.Y.Z and the legacy vX.Y.Z (only v0.1.0 exists);
            # rc tags of either form do not match.
            if final_tags="$(grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' <<<"$all_tags")"; then
              :
            elif [[ $? -eq 1 ]]; then
              final_tags="" # grep found no final tag
            else
              echo "::error::filtering the tag list failed"
              exit 1
            fi
            # Sort by version, so the legacy `v` must not take part in the
            # order: sort on "<version><TAB><tag>", then keep the tag.
            previous="$(
              { printf '%s\n' "$final_tags"; echo "$TAG"; } \
                | sed '/^$/d' \
                | while IFS= read -r t; do printf '%s\t%s\n' "${t#v}" "$t"; done \
                | sort -t "$(printf '\t')" -k1,1V -u \
                | cut -f2 | grep -B1 -x -F "$TAG" | head -n 1
            )"
            if [[ -n "$previous" && "$previous" != "$TAG" ]]; then
              echo "release notes since the previous final tag $previous"
              args+=(--notes-start-tag "$previous")
            else
              echo "no previous final tag; the release notes cover the whole history"
            fi
          fi
          gh release create "$TAG" "${args[@]}" assets/*
