# SPDX-License-Identifier: Apache-2.0
#
# Signed release workflow. Runs only for tags `X.Y.Z` and `X.Y.Z-rc.N`
# (plain semver, no `v` prefix; the legacy `v0.1.0*` tags predate this).
#
#   mode=build   (every rc tag; an emergency final tag, see ADR 0005)
#     verify -> build (amd64 | arm64) + licenses -> image -> smoke -> chart
#            -> release -> helm-index
#   mode=promote (a final tag with a release candidate on the same commit)
#     verify -> promote -> chart -> release -> helm-index
#
# A final release publishes the image of its release candidate: same digest,
# signed and attested again with the identity of the final tag, never rebuilt
# (docs/adr/0005-promote-release-candidates.md). `verify` picks the mode.
#
# No job restores or saves a cache: a cache written under a tag ref can never
# be restored by another tag, and the builds are signed artifacts.
#
# `helm-index` adds the chart to the classic HTTP Helm repository
# (https://jabbas.github.io/helm-charts); see docs/development.md.
#
# Procedure and verification: docs/development.md ("Releasing") and
# docs/security.md ("Release signing and SBOM"). Signatures are keyless
# (GitHub OIDC); the certificate identity is this file at the tag:
#   https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/<tag>
# so renaming this file changes the identity users verify against.
name: Release

on:
  push:
    tags:
      # Glob patterns, not regular expressions. Both are re-validated with a
      # regular expression in the `verify` job.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

# Nothing is granted by default; every job lists what it needs. Write scopes
# are on the jobs that push, and `id-token: write` only on the jobs that sign.
permissions: {}

# One run per tag. Never cancel a release half-way: a cancelled run leaves a
# pushed but unsigned image.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash # bash -eo pipefail

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/jabbas/secretspec-operator
  CHART_REPO: oci://ghcr.io/jabbas/charts
  CERT_OIDC_ISSUER: https://token.actions.githubusercontent.com
  # Pinned tools downloaded as release binaries. Each is verified against the
  # SHA-256 of the linux_amd64 archive (taken from the upstream
  # `*_checksums.txt` of that release). Bump version and checksum together.
  # Renovate proposes the versions (the `# renovate:` comments are read by
  # renovate.json) but cannot compute the checksums: a version-only bump fails
  # the `sha256sum --check` steps below, naming the variable to update. The CI
  # job `release-pins` (ci.yml) reads the SYFT/GRYPE/CRANE entries of this
  # block and runs those install steps on every pull request, found by job
  # and step name: keep the names `<TOOL>_VERSION` / `<TOOL>_SHA256` and the
  # steps "Install syft and grype" / "Install crane", or update that job.
  # renovate: datasource=github-releases depName=sigstore/cosign
  COSIGN_VERSION: v2.6.5
  # renovate: datasource=github-releases depName=anchore/syft extractVersion=^v(?<version>.+)$
  SYFT_VERSION: 1.55.0
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  # renovate: datasource=github-releases depName=anchore/grype extractVersion=^v(?<version>.+)$
  GRYPE_VERSION: 0.121.0
  GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
  # renovate: datasource=github-releases depName=google/go-containerregistry extractVersion=^v(?<version>.+)$
  CRANE_VERSION: 0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
  HELM_REPO_URL: https://jabbas.github.io/helm-charts

jobs:
  # Validates the tag against the workspace version, requires a green CI run
  # of the tagged commit on main (the test suite is not run again here), and
  # re-checks the advisory databases, which move independently of the code.
  verify:
    runs-on: ubuntu-24.04
    # ci-status.sh waits at most 30 min of wall-clock time (retries and API
    # latency included), plus at most one more poll (about a minute). The
    # 15 min of margin cover the setup, cargo deny and cargo audit that run
    # before it; keep this well above 30 min + that setup, so the script
    # reports its own timeout instead of the job being cancelled.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read # list the runs of ci.yml
    outputs:
      version: ${{ steps.version.outputs.version }}
      base: ${{ steps.version.outputs.base }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      mode: ${{ steps.mode.outputs.mode }}
      rc_tag: ${{ steps.mode.outputs.rc_tag }}
      rebuild_reason: ${{ steps.mode.outputs.rebuild_reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag must be checked against main
          persist-credentials: false
      # Toolchain only (cargo metadata, cargo deny); nothing is compiled, and
      # no cache is restored or saved: a cache written under a tag ref can
      # never be restored by another tag.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Check the tag against the workspace version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # semver.org: no leading zeros. ERE has no non-capturing groups, so
          # the groups are: 1 = base, 2-4 = its parts, 5 = the rc suffix.
          if [[ ! "$TAG" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-rc\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::tag '$TAG' is neither X.Y.Z nor X.Y.Z-rc.N (semver, no leading zeros)"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          version="$TAG" # the tag is the version
          prerelease=false
          if [[ -n "${BASH_REMATCH[5]}" ]]; then
            prerelease=true
          fi

          workspace="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "secretspec-operator") | .version')"
          chart_version="$(yq '.version' charts/secretspec-operator/Chart.yaml)"
          chart_app_version="$(yq '.appVersion' charts/secretspec-operator/Chart.yaml)"
          echo "tag=$TAG version=$version base=$base workspace=$workspace chart=$chart_version appVersion=$chart_app_version"

          # Final tag: equals the workspace version. rc tag: its base does.
          if [[ "$base" != "$workspace" ]]; then
            echo "::error::tag '$TAG' (version $base) does not match the workspace version $workspace"
            exit 1
          fi
          # The committed chart is never edited for an rc; it must carry the
          # workspace version, and the rc version is applied at `helm package`.
          if [[ "$chart_version" != "$workspace" || "$chart_app_version" != "$workspace" ]]; then
            echo "::error::Chart.yaml version/appVersion ($chart_version/$chart_app_version) must equal the workspace version $workspace"
            exit 1
          fi
          {
            echo "version=$version"
            echo "base=$base"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Check the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not reachable from main; releases are tagged on main"
            exit 1
          fi
      # build or promote (ADR 0005). Read through the API, not from the
      # checkout (see the script); fail-closed. Early: it is cheap, and a final
      # tag without a release candidate should not wait for CI first.
      - name: Select the release mode
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-mode.sh "$GITHUB_REF_NAME" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      # The same pinned prebuilt binaries as the `deny` and `audit` jobs of
      # ci.yml. CI may have run days before the tag, so the advisories are
      # checked again; licenses, bans and sources cannot change without a
      # commit and were checked by CI.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - run: cargo deny check advisories
      - run: cargo audit
      # Fail-closed: the tagged commit must have a successful ci.yml run from
      # a push to main (waits for one that is still running). Last, because
      # it may wait.
      - name: Check CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/ci-status.sh "$GITHUB_SHA"

  # Static musl binary per architecture, one parallel leg each; every leg
  # uploads its own artifact for the image job. Caching stays off in every
  # job of this workflow: these builds produce signed artifacts, so nothing
  # restored may end up in them, and nothing is saved (a cache written under
  # a tag ref can never be restored by another tag).
  build:
    needs: verify
    if: needs.verify.outputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            elf: x86-64
          - target: aarch64-unknown-linux-musl
            arch: arm64
            elf: aarch64
    name: build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false # nothing restored may end up in a signed artifact
          target: ${{ matrix.target }}
      # Same toolchain as docs/development.md ("Building the image").
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          # cargo-auditable embeds the dependency list in the binary, so the
          # SBOM and the vulnerability scan see the crates. The image is
          # `FROM scratch`, so the binary's crates are all there is to see.
          tool: cargo-zigbuild@0.23.4,cargo-auditable@0.7.7
      - name: Install zig
        run: |
          python3 -m venv "$RUNNER_TEMP/zig-venv"
          "$RUNNER_TEMP/zig-venv/bin/pip" install --require-hashes -r .github/requirements/ziglang.txt
          echo "$RUNNER_TEMP/zig-venv/bin" >> "$GITHUB_PATH"
      - name: Build ${{ matrix.arch }}
        # The zig linker prints a deprecation warning that cargo's build.warnings=deny
        # (set by setup-rust-toolchain) turns into an error; code warnings stay denied by CI clippy.
        env:
          CARGO_BUILD_WARNINGS: warn
          TARGET: ${{ matrix.target }}
        run: cargo xtask dist --target "$TARGET" --release
      - name: Check the binary
        env:
          ARCH: ${{ matrix.arch }}
          ELF: ${{ matrix.elf }}
        run: |
          # Static musl ELF for this architecture (`file` prints "statically
          # linked" or "static-pie linked").
          file "target/dist/$ARCH/secretspec-operator"
          file "target/dist/$ARCH/secretspec-operator" | grep -q "$ELF"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.arch }}
          path: target/dist/${{ matrix.arch }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Third-party licence texts for /licenses/ in the image
  # (build/Containerfile). Target-independent, so generated once, in parallel
  # with the build legs.
  licenses:
    needs: verify
    if: needs.verify.outputs.mode == 'build'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - name: Collect the licence texts
        run: |
          cargo xtask licenses
          test -s target/dist/licenses/LICENSE
          test -s target/dist/licenses/NOTICE
          test -s target/dist/licenses/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-licenses
          path: target/dist/licenses
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Multi-arch image: push by digest, scan, SBOM, sign, attest, then tag and
  # verify. The tag is set last and only if it is free or already points at the
  # same digest, so no re-run can move it: a re-run that finds the tag resumes
  # with the digest it points to instead of building a new image. Runs only in
  # mode=build (its `needs` are skipped in promote mode).
  image:
    needs: [verify, build, licenses] # `build` = both architecture legs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image and its signatures
      id-token: write # keyless signing
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
    outputs:
      digest: ${{ steps.index.outputs.digest }}
      digest_amd64: ${{ steps.platforms.outputs.amd64 }}
      digest_arm64: ${{ steps.platforms.outputs.arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Each artifact holds the contents of one directory; they are put back
      # into the target/dist/<arch>/ and target/dist/licenses/ layout that
      # build/Containerfile copies from.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-amd64
          path: target/dist/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-arm64
          path: target/dist/arm64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-licenses
          path: target/dist/licenses
      - name: Restore the executable bit
        # Artifacts do not keep file modes; COPY in the Containerfile would
        # otherwise produce a non-executable ENTRYPOINT.
        run: |
          chmod 0755 target/dist/amd64/secretspec-operator target/dist/arm64/secretspec-operator
          ls -l target/dist/amd64 target/dist/arm64 target/dist/licenses
          test -s target/dist/licenses/LICENSE
          test -s target/dist/licenses/NOTICE
          test -s target/dist/licenses/THIRD-PARTY-LICENSES.txt
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install syft and grype
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin"
          for tool in syft grype; do
            case "$tool" in
              syft)  version="$SYFT_VERSION";  sha="$SYFT_SHA256";  project=anchore/syft ;;
              grype) version="$GRYPE_VERSION"; sha="$GRYPE_SHA256"; project=anchore/grype ;;
            esac
            archive="${tool}_${version}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
              "https://github.com/$project/releases/download/v${version}/${archive}"
            if ! echo "$sha  $RUNNER_TEMP/$archive" | sha256sum --check --strict -; then
              echo "::error::$archive does not match the pinned checksum; update ${tool^^}_SHA256 (and ${tool^^}_VERSION) together in the env block of release.yml, from the checksums file of the upstream release (docs/development.md, \"Pinned tools\")"
              exit 1
            fi
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tools/bin" "$tool"
          done
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false # no cache is saved under a tag ref
          # BuildKit v0.34.1, pinned by index digest.
          driver-opts: image=moby/buildkit@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Resume: when the tag already exists (an earlier attempt got as far as
      # tagging), its digest is used and nothing is rebuilt. The build is not
      # reproducible, so a rebuild would produce a different digest.
      - name: Look for an already published tag
        id: existing
        run: |
          source .github/scripts/registry-lookup.sh
          # Lenient: a wrong "absent" here only costs a pointless build, the
          # tag step below re-checks strictly before it writes anything.
          digest="$(tag_digest "$IMAGE:$TAG" lenient)"
          if [[ -n "$digest" ]]; then
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "::notice::$IMAGE:$TAG already exists ($digest); resuming with it, nothing is rebuilt"
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Pushed by digest, without any tag: the tag is set only after the image
      # has been scanned, signed and attested (see "Tag the image").
      - name: Build and push the multi-arch image (by digest)
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Containerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Source link on the index itself, so registries (GHCR links the
          # package to the repository by it) see it on the tagged manifest.
          # The per-platform images keep the same value as a config label
          # from the Containerfile.
          annotations: |
            index:org.opencontainers.image.source=https://github.com/jabbas/secretspec-operator
          # The version label is the base version X.Y.Z, also for a release
          # candidate: the image of `X.Y.Z-rc.N` is promoted unchanged to
          # `X.Y.Z`, so its labels must be right for both. The binary reports
          # the same version; the rc identity lives in the tag and in the
          # signatures.
          build-args: |
            VERSION=${{ needs.verify.outputs.base }}
            REVISION=${{ github.sha }}
          # Keep the index plain (two platform manifests). Signing and the
          # SBOM attestation are done below with cosign.
          provenance: false
          sbom: false
      - name: Select the index digest
        id: index
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Resolve the per-platform digests
        id: platforms
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          [[ "$INDEX_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > index.json
          jq . index.json
          test "$(jq '.manifests | length' index.json)" = 2
          # The index carries the source annotation (see the build step). A
          # malformed index.json already failed at `jq .` above, and a failing
          # jq in the assignment stops the step too.
          source="$(jq -r '.annotations["org.opencontainers.image.source"] // ""' index.json)"
          if [[ "$source" != "https://github.com/jabbas/secretspec-operator" ]]; then
            # %q: the value comes from the registry; a newline in it must not
            # end the workflow command and start another one.
            printf '::error::the image index has the source annotation %q, not the repository URL\n' "$source"
            exit 1
          fi
          for arch in amd64 arm64; do
            digest="$(jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' index.json)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
      # Vulnerability scan of the pushed digests. Fails on a fixable
      # high/critical finding, before anything is signed. The image has no OS
      # layer, so grype sees only the crates embedded by cargo-auditable; the
      # next step fails the release if that data is missing (an empty scan).
      - name: Scan the image
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          grype "registry:$IMAGE@$DIGEST_AMD64" --fail-on high --only-fixed
          grype "registry:$IMAGE@$DIGEST_ARM64" --fail-on high --only-fixed
      - name: Generate the SBOMs (SPDX JSON, one per architecture)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          mkdir sbom
          syft "registry:$IMAGE@$DIGEST_AMD64" -o "spdx-json=sbom/secretspec-operator-${TAG}-linux-amd64.spdx.json"
          syft "registry:$IMAGE@$DIGEST_ARM64" -o "spdx-json=sbom/secretspec-operator-${TAG}-linux-arm64.spdx.json"
          ls -l sbom
          # The binary is built with cargo-auditable: each SBOM must list the
          # Rust crates (pkg:cargo/...). The image is `FROM scratch`: there
          # are no OS packages, so without the embedded data the SBOM (and the
          # grype scan above) would be empty and a build that lost it would go
          # unnoticed.
          for sbom in sbom/*.spdx.json; do
            crates="$(jq '[.packages[] | select(any(.externalRefs[]?; (.referenceLocator // "") | startswith("pkg:cargo/")))] | length' "$sbom")"
            echo "$sbom: $crates Rust crates"
            test "$crates" -ge 100
          done
      # Signatures: the index (what a tag resolves to, and what `cosign verify
      # <image>:<tag>` checks) and each platform manifest. The SBOM
      # attestation goes on the platform manifests, because an SBOM describes
      # one platform's contents.
      - name: Sign the image
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign sign --yes \
            "$IMAGE@$INDEX_DIGEST" "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
      - name: Attest the SBOMs
        env:
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "sbom/secretspec-operator-${TAG}-linux-amd64.spdx.json" "$IMAGE@$DIGEST_AMD64"
          cosign attest --yes --type spdxjson \
            --predicate "sbom/secretspec-operator-${TAG}-linux-arm64.spdx.json" "$IMAGE@$DIGEST_ARM64"
      # The only step that creates the tag. It refuses to touch a tag that
      # points anywhere else.
      - name: Tag the image
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          source .github/scripts/registry-lookup.sh
          # Strict: the repository exists by now (the image was pushed by
          # digest), so a missing tag is answered "manifest unknown". Any
          # other answer, in particular an access error, stops the job
          # instead of risking an overwrite.
          current="$(tag_digest "$IMAGE:$TAG" strict)"
          if [[ -z "$current" ]]; then
            docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$INDEX_DIGEST"
            current="$(tag_digest "$IMAGE:$TAG" strict)"
          fi
          if [[ "$current" != "$INDEX_DIGEST" ]]; then
            # %q: `current` is read from the registry (see the annotation check).
            printf '::error::%s:%s points to %q, not to %s; a pushed tag is never moved. Cut the next release candidate.\n' \
              "$IMAGE" "$TAG" "$current" "$INDEX_DIGEST"
            exit 1
          fi
      # The commands documented in docs/installation.md and docs/security.md.
      - name: Verify what was published
        env:
          INDEX_DIGEST: ${{ steps.index.outputs.digest }}
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${TAG}"

          # By tag, as a user does; it must resolve to the digest we signed.
          cosign verify "$IMAGE:$TAG" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > verify.json
          jq -e --arg d "$INDEX_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' verify.json

          for digest in "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            cosign verify "$IMAGE@$digest" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > /dev/null
            cosign verify-attestation "$IMAGE@$digest" --type spdxjson \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > attestation.json
            # The signed statement carries the SPDX document as its predicate.
            jq -e -s 'length > 0 and all(.[]; (.payload | @base64d | fromjson | .predicateType == "https://spdx.dev/Document"))' attestation.json
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Runs the pushed image on both architectures (arm64 under QEMU).
  smoke:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    name: smoke (${{ matrix.platform }})
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: false # no cache is saved under a tag ref
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Run the image
        env:
          PLATFORM: ${{ matrix.platform }}
          INDEX_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          docker run --rm --platform "$PLATFORM" --read-only --user 65532:65532 \
            "$IMAGE@$INDEX_DIGEST" --help

  # mode=promote (ADR 0005): the release candidate's image becomes the final
  # release. Nothing is built: the same index digest gets the final tag, and
  # is signed and attested again with the identity of THIS (final) tag. Before
  # anything is written, the release candidate is proved to come from this
  # workflow (its signature), to have the platforms and labels of this commit,
  # and to be free of fixable high/critical findings in today's database. No
  # smoke test: the identical digest was smoke-tested in the rc run.
  promote:
    needs: verify
    if: needs.verify.outputs.mode == 'promote'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # tag the image, push signatures and attestations
      id-token: write # keyless signing
    env:
      TAG: ${{ github.ref_name }}
      BASE_VERSION: ${{ needs.verify.outputs.base }}
      RC_TAG: ${{ needs.verify.outputs.rc_tag }}
    outputs:
      digest: ${{ steps.rc.outputs.digest }}
    steps:
      # registry-lookup.sh (the tag guard) comes from the tagged commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Install syft and grype
        run: |
          mkdir -p "$RUNNER_TEMP/tools/bin"
          for tool in syft grype; do
            case "$tool" in
              syft)  version="$SYFT_VERSION";  sha="$SYFT_SHA256";  project=anchore/syft ;;
              grype) version="$GRYPE_VERSION"; sha="$GRYPE_SHA256"; project=anchore/grype ;;
            esac
            archive="${tool}_${version}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
              "https://github.com/$project/releases/download/v${version}/${archive}"
            if ! echo "$sha  $RUNNER_TEMP/$archive" | sha256sum --check --strict -; then
              echo "::error::$archive does not match the pinned checksum; update ${tool^^}_SHA256 (and ${tool^^}_VERSION) together in the env block of release.yml, from the checksums file of the upstream release (docs/development.md, \"Pinned tools\")"
              exit 1
            fi
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tools/bin" "$tool"
          done
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - name: Install crane
        run: |
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${archive}"
          if ! echo "$CRANE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -; then
            echo "::error::$archive does not match the pinned checksum; update CRANE_SHA256 (and CRANE_VERSION) together in the env block of release.yml, from checksums.txt of the upstream release (docs/development.md, \"Pinned tools\")"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tools/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tools/bin" crane
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # 1. The digest the release candidate tag points to. Everything below
      #    works on this digest, never on the tag again.
      - name: Resolve the release candidate image
        id: rc
        run: |
          # The tag was chosen by release-mode.sh; check its shape again.
          if [[ "$RC_TAG" != "$BASE_VERSION"-rc.* || ! "${RC_TAG#"$BASE_VERSION"-rc.}" =~ ^(0|[1-9][0-9]*)$ ]]; then
            # %q: the tag name comes from the GitHub API (release-mode.sh).
            printf '::error::%q is not a release candidate of %s\n' "$RC_TAG" "$BASE_VERSION"
            exit 1
          fi
          digest="$(crane digest "$IMAGE:$RC_TAG")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "$IMAGE:$RC_TAG is $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # 2. The bytes were signed by this workflow at the release candidate's
      #    tag: they were built and tested there.
      - name: Verify the release candidate signature
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${RC_TAG}"
          cosign verify "$IMAGE@$RC_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > rc-verify.json
          jq -e --arg d "$RC_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' rc-verify.json
      # 3. Exactly the two platforms of a release.
      - name: Resolve the per-platform digests
        id: platforms
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          crane manifest "$IMAGE@$RC_DIGEST" > index.json
          jq . index.json
          jq -e '(.manifests | length) == 2
                 and ([.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | sort) == ["linux/amd64", "linux/arm64"]' index.json
          for arch in amd64 arm64; do
            digest="$(jq -r --arg arch "$arch" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' index.json)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$arch=$digest" >> "$GITHUB_OUTPUT"
          done
      # 4. The image is the one built from this commit, for this version: the
      #    revision is the tagged commit and the version is the base version
      #    (all builds label X.Y.Z, also release candidates).
      - name: Check the image labels
        env:
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          bad=0
          for arch in amd64 arm64; do
            case "$arch" in
              amd64) digest="$DIGEST_AMD64" ;;
              arm64) digest="$DIGEST_ARM64" ;;
            esac
            config="$(crane config "$IMAGE@$digest")"
            revision="$(jq -r '.config.Labels["org.opencontainers.image.revision"] // ""' <<<"$config")"
            version="$(jq -r '.config.Labels["org.opencontainers.image.version"] // ""' <<<"$config")"
            echo "$arch: revision=$revision version=$version"
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              # %q: the labels are read from the registry.
              printf '::error::%s image label revision is %q, not the tagged commit %s\n' "$arch" "$revision" "$GITHUB_SHA"
              bad=1
            fi
            if [[ "$version" != "$BASE_VERSION" ]]; then
              printf '::error::%s image label version is %q, not %s\n' "$arch" "$version" "$BASE_VERSION"
              bad=1
            fi
            if ! jq -e --arg arch "$arch" '.os == "linux" and .architecture == $arch' <<<"$config" > /dev/null; then
              echo "::error::the $arch image config does not say linux/$arch"
              bad=1
            fi
          done
          exit "$bad"
      # 5. The vulnerability database is fresher than at release candidate
      #    time. A finding means: fix it and cut a new release candidate.
      - name: Scan the image
        env:
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          grype "registry:$IMAGE@$DIGEST_AMD64" --fail-on high --only-fixed
          grype "registry:$IMAGE@$DIGEST_ARM64" --fail-on high --only-fixed
      # 6. The SBOMs, named after the final tag. The attestation is the first
      #    write; it carries the identity of this (final) tag.
      - name: Generate the SBOMs (SPDX JSON, one per architecture)
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          mkdir sbom
          syft "registry:$IMAGE@$DIGEST_AMD64" -o "spdx-json=sbom/secretspec-operator-${TAG}-linux-amd64.spdx.json"
          syft "registry:$IMAGE@$DIGEST_ARM64" -o "spdx-json=sbom/secretspec-operator-${TAG}-linux-arm64.spdx.json"
          ls -l sbom
          # As in the build mode: the binary is built with cargo-auditable, so
          # each SBOM must list the Rust crates.
          for sbom in sbom/*.spdx.json; do
            crates="$(jq '[.packages[] | select(any(.externalRefs[]?; (.referenceLocator // "") | startswith("pkg:cargo/")))] | length' "$sbom")"
            echo "$sbom: $crates Rust crates"
            test "$crates" -ge 100
          done
      - name: Attest the SBOMs
        env:
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "sbom/secretspec-operator-${TAG}-linux-amd64.spdx.json" "$IMAGE@$DIGEST_AMD64"
          cosign attest --yes --type spdxjson \
            --predicate "sbom/secretspec-operator-${TAG}-linux-arm64.spdx.json" "$IMAGE@$DIGEST_ARM64"
      # 7. The final identity signs the same digests.
      - name: Sign the image
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign sign --yes \
            "$IMAGE@$RC_DIGEST" "$IMAGE@$DIGEST_AMD64" "$IMAGE@$DIGEST_ARM64"
      # 8. The only step that creates the tag; same guard as in the build
      #    mode: an existing tag must already be this digest (a re-run).
      - name: Tag the image
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
        run: |
          source .github/scripts/registry-lookup.sh
          # Strict: the repository exists, so a missing tag is answered
          # "manifest unknown". Any other answer (in particular an access
          # error) stops the job instead of risking an overwrite.
          current="$(tag_digest "$IMAGE:$TAG" strict)"
          if [[ -z "$current" ]]; then
            docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE@$RC_DIGEST"
            current="$(tag_digest "$IMAGE:$TAG" strict)"
          fi
          if [[ "$current" != "$RC_DIGEST" ]]; then
            # %q: `current` is read from the registry (see the annotation check).
            printf '::error::%s:%s points to %q, not to the release candidate digest %s; a pushed tag is never moved. Cut the next release candidate.\n' \
              "$IMAGE" "$TAG" "$current" "$RC_DIGEST"
            exit 1
          fi
      # 9. The commands documented in docs/installation.md and
      #    docs/security.md, by tag, with the final identity; and the release
      #    candidate's own signature is still there on the same digest.
      - name: Verify what was published
        env:
          RC_DIGEST: ${{ steps.rc.outputs.digest }}
          DIGEST_AMD64: ${{ steps.platforms.outputs.amd64 }}
          DIGEST_ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${TAG}"
          rc_identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${RC_TAG}"

          cosign verify "$IMAGE:$TAG" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > verify.json
          jq -e --arg d "$RC_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' verify.json
          cosign verify "$IMAGE:$TAG" \
            --certificate-identity "$rc_identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > rc-verify-by-tag.json
          jq -e --arg d "$RC_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' rc-verify-by-tag.json

          for digest in "$DIGEST_AMD64" "$DIGEST_ARM64"; do
            cosign verify "$IMAGE@$digest" \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > /dev/null
            cosign verify-attestation "$IMAGE@$digest" --type spdxjson \
              --certificate-identity "$identity" \
              --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > attestation.json
            # The signed statement carries the SPDX document as its predicate.
            jq -e -s 'length > 0 and all(.[]; (.payload | @base64d | fromjson | .predicateType == "https://spdx.dev/Document"))' attestation.json
          done
      # Same artifact name as the `image` job's: only one of them runs.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-sbom
          path: sbom
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The chart is packaged from the tagged commit in both modes. In promote
  # mode it must also equal the release candidate's chart except for its
  # version (see the comparison step). `needs` includes both modes' jobs; the
  # condition names which of them must have run, so a skipped job is never
  # mistaken for a passed one and a failed job never lets the chart through.
  chart:
    needs: [verify, image, smoke, promote]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && (
        (needs.verify.outputs.mode == 'build' && needs.image.result == 'success'
          && needs.smoke.result == 'success' && needs.promote.result == 'skipped')
        || (needs.verify.outputs.mode == 'promote' && needs.promote.result == 'success'
          && needs.image.result == 'skipped' && needs.smoke.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the chart and its signature
      id-token: write # keyless signing
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      RC_TAG: ${{ needs.verify.outputs.rc_tag }}
    outputs:
      # Manifest digest of the pushed, signed and verified chart; `helm-index`
      # checks the HTTP package against its layer.
      digest: ${{ steps.chart_digest.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      # cosign reads the Docker credentials; helm keeps its own.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to the chart registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
      # Resume: a chart version that is already published is never packaged
      # or pushed again (the package is not byte-reproducible, so a second
      # push would put a different digest under the same version). The
      # published package is pulled instead and carried through the same
      # checks, signing and verification.
      - name: Look for an already published chart
        id: existing
        run: |
          source .github/scripts/registry-lookup.sh
          mkdir existing
          chart_resolve "$CHART_REPO/secretspec-operator" "$VERSION" existing pull.log
          echo "chart lookup: $CHART_STATE"
          if [[ "$CHART_STATE" == found ]]; then
            cat pull.log
            digest="$(awk '/^Digest:/ {print $2}' pull.log)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "::notice::chart $VERSION already exists ($digest); resuming with it, nothing is pushed"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            # helm's stderr only (no credentials, no secret data): shows how
            # the registry really answered for a package that is not there.
            echo "--- pull.log ---"
            cat pull.log
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # The committed Chart.yaml keeps the workspace version; the release
      # version (which may be an rc) is applied here only.
      - name: Package the chart
        env:
          PUBLISHED: ${{ steps.existing.outputs.published }}
        run: |
          mkdir chart
          if [[ "$PUBLISHED" == "true" ]]; then
            cp "existing/secretspec-operator-${VERSION}.tgz" chart/
          else
            helm package charts/secretspec-operator \
              --version "$VERSION" --app-version "$VERSION" --destination chart
          fi
          ls -l chart
      - name: Check the packaged chart
        run: |
          package="chart/secretspec-operator-${VERSION}.tgz"
          test "$(helm show chart "$package" | yq '.version')" = "$VERSION"
          test "$(helm show chart "$package" | yq '.appVersion')" = "$VERSION"
          # The default image must be exactly the image pushed for this tag
          # (the tag, the chart version and the appVersion are identical).
          images="$(helm template secretspec-operator "$package" \
            | yq 'select(.kind == "Deployment") | .spec.template.spec.containers[].image')"
          echo "rendered image(s): $images"
          test "$images" = "$IMAGE:$TAG"
      # Promote mode: the chart is packaged again (its version and appVersion
      # are the final ones), but it must be the chart that was tested with the
      # release candidate: same entries (types, modes, symlink targets) and
      # file contents, and Chart.yaml different only in
      # version and appVersion. The rc chart is proved to come from this
      # workflow at the rc tag before it is trusted as the reference.
      - name: Compare with the release candidate chart
        if: needs.verify.outputs.mode == 'promote'
        run: |
          mkdir rc-pull rc-extract final-extract
          helm pull "$CHART_REPO/secretspec-operator" --version "$RC_TAG" --destination rc-pull > rc-pull.log 2>&1 || {
            cat rc-pull.log
            printf '::error::could not pull the release candidate chart %q\n' "$RC_TAG"
            exit 1
          }
          cat rc-pull.log
          rc_digest="$(awk '/^Digest:/ {print $2}' rc-pull.log)"
          [[ "$rc_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${RC_TAG}"
          cosign verify "${CHART_REPO#oci://}/secretspec-operator@$rc_digest" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > rc-chart-verify.json
          jq -e --arg d "$rc_digest" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' rc-chart-verify.json
          tar -xzf "rc-pull/secretspec-operator-${RC_TAG}.tgz" -C rc-extract
          tar -xzf "chart/secretspec-operator-${VERSION}.tgz" -C final-extract
          bash .github/scripts/chart-compare.sh rc-extract/secretspec-operator final-extract/secretspec-operator
      - name: Push the chart
        id: push
        if: steps.existing.outputs.published != 'true'
        run: |
          source .github/scripts/registry-lookup.sh
          # `helm push` overwrites an existing version, so look once more,
          # right before writing. The result of the first lookup may have been
          # a misread access error.
          mkdir recheck
          chart_resolve "$CHART_REPO/secretspec-operator" "$VERSION" recheck recheck.log
          echo "chart recheck: $CHART_STATE"
          if [[ "$CHART_STATE" == found ]]; then
            echo "::error::chart $VERSION exists in the registry; not pushing over it. Re-run the failed jobs to resume with it."
            exit 1
          fi
          echo "--- recheck.log ---"
          cat recheck.log
          helm push "chart/secretspec-operator-${VERSION}.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest="$(awk '/^Digest:/ {print $2}' push.log)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Select the chart digest
        id: chart_digest
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          PUSHED_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          digest="${EXISTING_DIGEST:-$PUSHED_DIGEST}"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign the chart
        env:
          CHART_DIGEST: ${{ steps.chart_digest.outputs.digest }}
        run: cosign sign --yes "${CHART_REPO#oci://}/secretspec-operator@$CHART_DIGEST"
      - name: Verify the chart
        env:
          CHART_DIGEST: ${{ steps.chart_digest.outputs.digest }}
        run: |
          identity="https://github.com/jabbas/secretspec-operator/.github/workflows/release.yml@refs/tags/${TAG}"
          cosign verify "${CHART_REPO#oci://}/secretspec-operator:${VERSION}" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "$CERT_OIDC_ISSUER" > verify.json
          jq -e --arg d "$CHART_DIGEST" \
            'length > 0 and all(.[]; .critical.image."docker-manifest-digest" == $d)' verify.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-chart
          path: chart
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The SBOMs come from `promote` or from `image` (both upload the artifact
  # `release-sbom`; only one of them runs). Same explicit job graph as `chart`.
  release:
    needs: [verify, image, smoke, promote, chart]
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && needs.chart.result == 'success' && (
        (needs.verify.outputs.mode == 'build' && needs.image.result == 'success'
          && needs.smoke.result == 'success' && needs.promote.result == 'skipped')
        || (needs.verify.outputs.mode == 'promote' && needs.promote.result == 'success'
          && needs.image.result == 'skipped' && needs.smoke.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its assets
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      MODE: ${{ needs.verify.outputs.mode }}
      RC_TAG: ${{ needs.verify.outputs.rc_tag }}
      REBUILD_REASON: ${{ needs.verify.outputs.rebuild_reason }}
      PROMOTED_DIGEST: ${{ needs.promote.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Create the release
        run: |
          ls -l assets
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/SHA256SUMS
          cat assets/SHA256SUMS

          cat > notes.md <<EOF
          Image: \`$IMAGE:$TAG\` (linux/amd64, linux/arm64)
          Chart: \`oci://ghcr.io/jabbas/charts/secretspec-operator\` version \`$VERSION\`

          The image and the chart are signed with cosign (keyless, GitHub OIDC); the
          SPDX SBOMs are signed attestations on the per-platform images and are
          attached here as plain files. How to verify: [docs/security.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/security.md#release-signing-and-sbom).

          EOF
          # How the image was made (ADR 0005). The values come from the env,
          # never from the template text.
          if [[ "$MODE" == promote ]]; then
            [[ "$PROMOTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            printf '%s\n\n' "Image promoted from \`$RC_TAG\` without rebuilding (digest \`$PROMOTED_DIGEST\`)." >> notes.md
          elif [[ -n "$REBUILD_REASON" ]]; then
            printf 'Rebuilt without promoting a release candidate: %s\n\n' "$REBUILD_REASON" >> notes.md
          fi
          printf -- '---\n\n' >> notes.md

          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG"
                --notes-file notes.md --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            # A release candidate: the notes cover the changes since the
            # previous tag, whatever it is (GitHub's default).
            args+=(--prerelease)
          else
            # A final release: the notes cover everything since the previous
            # FINAL tag, so the release candidates in between are included.
            # The first final release has no start tag: the notes then cover
            # the whole history. A failed tag lookup is NOT that case: it
            # fails the job (the exit status of gh is kept apart from the
            # filter's, where only "no match" is tolerated).
            if ! all_tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name')"; then
              echo "::error::could not list the repository tags; refusing to publish notes without a start tag"
              exit 1
            fi
            # Final tags are X.Y.Z and the legacy vX.Y.Z (only v0.1.0 exists);
            # rc tags of either form do not match.
            if final_tags="$(grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' <<<"$all_tags")"; then
              :
            elif [[ $? -eq 1 ]]; then
              final_tags="" # grep found no final tag
            else
              echo "::error::filtering the tag list failed"
              exit 1
            fi
            # Sort by version, so the legacy `v` must not take part in the
            # order: sort on "<version><TAB><tag>", then keep the tag. Only
            # identical lines are dropped (`sort -u` on the whole line, before
            # the key is added), so a stray vX.Y.Z next to X.Y.Z cannot
            # swallow $TAG; on a version tie the plain tag sorts first.
            sorted="$(
              { printf '%s\n' "$final_tags"; echo "$TAG"; } \
                | sed '/^$/d' | sort -u \
                | while IFS= read -r t; do printf '%s\t%s\n' "${t#v}" "$t"; done \
                | sort -t "$(printf '\t')" -k1,1V \
                | cut -f2
            )"
            if ! grep -qxF "$TAG" <<<"$sorted"; then
              echo "::error::the release tag '$TAG' is missing from the sorted tag list"
              exit 1
            fi
            previous="$(grep -B1 -x -F "$TAG" <<<"$sorted" | head -n 1)"
            if [[ -n "$previous" && "$previous" != "$TAG" ]]; then
              echo "release notes since the previous final tag $previous"
              args+=(--notes-start-tag "$previous")
            else
              echo "no previous final tag; the release notes cover the whole history"
            fi
          fi
          gh release create "$TAG" "${args[@]}" assets/*

  # Adds the chart to the classic HTTP Helm repository (jabbas/helm-charts,
  # served by GitHub Pages). The repository holds only index.yaml; the entry
  # points at the release asset created above, so this job runs after
  # `release`. It can write nowhere in this repository or its packages: the
  # job token is read-only, and the one write credential is the fine-grained
  # PAT of Environment `helm-charts`, scoped to jabbas/helm-charts. The job is
  # idempotent: re-run it on its own after a failure.
  #
  # Trust: Helm and Flux do not verify signatures for HTTP repositories. The
  # package is tied to the signed OCI chart instead: its SHA-256 must equal
  # the digest of the OCI chart layer (the manifest is signed by `chart`),
  # the SHA256SUMS entry and the index digest. docs/installation.md shows how
  # users check the same chain.
  helm-index:
    needs: [verify, chart, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: helm-charts
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.verify.outputs.version }}
      CHART_DIGEST: ${{ needs.chart.outputs.digest }}
    steps:
      - name: Check the credential is present
        env:
          HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}
        run: |
          if [[ -z "$HELM_CHARTS_TOKEN" ]]; then
            echo "::error::secret HELM_CHARTS_TOKEN is missing in Environment 'helm-charts'; see docs/development.md (Releasing). Re-run this job after adding it."
            exit 1
          fi
      # This repository first: the scripts come from the tagged commit. The
      # helm-charts checkout below must come after it, because a checkout
      # cleans the workspace.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      # yq parses and rewrites the shared index, so it is pinned (checksum
      # verified). jq is the one of the runner image, used only to read the
      # OCI manifest.
      - name: Install yq
        run: bash .github/scripts/install-yq.sh
      - name: Install crane
        run: |
          archive="go-containerregistry_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/google/go-containerregistry/releases/download/v${CRANE_VERSION}/${archive}"
          if ! echo "$CRANE_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict -; then
            echo "::error::$archive does not match the pinned checksum; update CRANE_SHA256 (and CRANE_VERSION) together in the env block of release.yml, from checksums.txt of the upstream release (docs/development.md, \"Pinned tools\")"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tools/bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/tools/bin" crane
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
      # The package is the release asset itself (the file the index will point
      # at), not a build artifact: artifacts expire after 7 days, and a re-run
      # must keep working. It is checked before the helm-charts credential is
      # written anywhere. The OCI manifest is read by digest (anonymously: the
      # package is public), so crane verifies the bytes against the digest that
      # `chart` signed.
      - name: Check the package against the signed chart
        id: package
        run: |
          if [[ ! "$CHART_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf '::error::the chart digest %q from the chart job is not a sha256 digest\n' "$CHART_DIGEST"
            exit 1
          fi
          file="secretspec-operator-${VERSION}.tgz"
          package="chart/$file"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"

          # 1. The asset the index will point at: HTTP 200 after redirects.
          mkdir chart
          status="$(curl -sSL --retry 3 -o "$package" -w '%{http_code}' "$release_url/$file")"
          if [[ "$status" != 200 ]]; then
            echo "::error::$release_url/$file answered HTTP $status, expected 200"
            exit 1
          fi
          sha="$(sha256sum "$package" | cut -d' ' -f1)"
          echo "release asset sha256: $sha"

          # 2. The OCI chart layer of the signed manifest.
          manifest="$(crane manifest "${CHART_REPO#oci://}/secretspec-operator@$CHART_DIGEST")"
          layer="$(jq -r '
            if (.layers | length) == 1 and .layers[0].mediaType == "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
            then .layers[0].digest else empty end' <<< "$manifest")"
          if [[ ! "$layer" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the OCI chart manifest $CHART_DIGEST does not have exactly one chart layer"
            exit 1
          fi
          echo "OCI chart layer: $layer"
          if [[ "$layer" != "sha256:$sha" ]]; then
            echo "::error::release asset sha256:$sha differs from the OCI chart layer $layer"
            exit 1
          fi

          # 3. SHA256SUMS of the release.
          curl -fsSL --retry 3 -o SHA256SUMS "$release_url/SHA256SUMS"
          listed="$(awk -v f="$file" '$2 == f {print $1}' SHA256SUMS)"
          if [[ "$listed" != "$sha" ]]; then
            # %q: SHA256SUMS is a downloaded file.
            printf '::error::SHA256SUMS lists %q for %s, the release asset is %s\n' "$listed" "$file" "$sha"
            exit 1
          fi
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
      # The token is used for the clone only and is not stored (the push
      # supplies it per command, see publish_index in helm-index.sh).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jabbas/helm-charts
          path: helm-charts
          token: ${{ secrets.HELM_CHARTS_TOKEN }}
          persist-credentials: false
      # Adds the entry (the one entry helm builds for the package is inserted
      # into the existing document, which is otherwise left untouched),
      # commits and pushes. A lost push race is retried from the new remote
      # state; a version that is already listed with another digest fails;
      # with the same digest it is a no-op.
      - name: Update the index
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
          HELM_CHARTS_TOKEN: ${{ secrets.HELM_CHARTS_TOKEN }}
        run: |
          source .github/scripts/helm-index.sh
          publish_index helm-charts "chart/secretspec-operator-${VERSION}.tgz" "$VERSION" "$SHA256" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
      # Pages builds after the push. A slow build (the version is not listed
      # yet) is reported, not failed: the index is pushed, and a re-run of this
      # job waits again. A DIFFERENT digest for the version fails the job.
      - name: Wait for the index to be served
        env:
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          source .github/scripts/helm-index.sh
          rc=0
          wait_for_pages "$HELM_REPO_URL/index.yaml" "$VERSION" "$SHA256" || rc=$?
          case "$rc" in
            0)
              echo "$VERSION is served at $HELM_REPO_URL" >> "$GITHUB_STEP_SUMMARY"
              ;;
            1)
              echo "::warning::$HELM_REPO_URL/index.yaml does not list $VERSION yet (the index is pushed; the Pages build is slow or failed). Check the Pages deployment of jabbas/helm-charts, then re-run this job."
              echo "**$HELM_REPO_URL/index.yaml does not list $VERSION yet.** The index is pushed; check the Pages build of jabbas/helm-charts." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "**$HELM_REPO_URL/index.yaml serves a different digest for $VERSION.**" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
